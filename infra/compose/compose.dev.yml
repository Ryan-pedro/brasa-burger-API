# Dependências do ambiente de desenvolvimento local.
# Subir:   docker compose -f infra/compose/compose.dev.yml up -d
# Parar:   docker compose -f infra/compose/compose.dev.yml down
# Zerar o banco (apaga os dados): acrescente -v ao comando "down".
#
# As credenciais abaixo valem SOMENTE para desenvolvimento local.

name: brasa-dev

services:
  postgres:
    image: postgres:17
    container_name: brasa-postgres
    environment:
      POSTGRES_USER: brasa
      POSTGRES_PASSWORD: brasa_dev
      POSTGRES_DB: brasa
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brasa -d brasa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
